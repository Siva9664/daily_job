name: Daily Job & Internship Alert

on:
  # ── Scheduled run ─────────────────────────────────────────
  # Runs every day at 02:30 UTC (8:00 AM IST, 10:30 PM EDT)
  # Adjust the cron expression to your preferred time.
  # Cron syntax: minute hour day month weekday
  schedule:
    - cron: "30 2 * * *"

  # ── Manual trigger ────────────────────────────────────────
  # Allows you to run the workflow manually from the
  # GitHub Actions tab at any time (great for testing).
  workflow_dispatch:

jobs:
  send-alert:
    name: Fetch Jobs & Send Digest Email
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Check out the repository ───────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Restore seen_jobs.json from cache ──────────────
      # Uses run_id in the primary key to ensure cache saves a fresh entry
      # on every run, while falling back to the latest prefix.
      - name: Restore seen_jobs cache
        uses: actions/cache@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-${{ runner.os }}-
            seen-jobs-

      # ── 3. Set up Python ──────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 4. Install dependencies ───────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Run the alert script ───────────────────────────
      # Secrets are injected as environment variables.
      # If sending fails, the script exits with non-zero status.
      - name: Run job alert
        env:
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          KEYWORDS:        ${{ secrets.KEYWORDS }}
          ENABLE_LINKEDIN: ${{ secrets.ENABLE_LINKEDIN || vars.ENABLE_LINKEDIN || 'false' }}
        run: python job_alert.py

      # ── 6. Commit and push updated seen_jobs.json ─────────
      # Persists deduplication state directly in the repository so
      # state is never lost even if cache expires.
      - name: Commit and push updated seen_jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --staged --quiet; then
            echo "No changes in seen_jobs.json to commit."
          else
            git commit -m "chore: update seen_jobs.json [skip ci]"
            git push
          fi

